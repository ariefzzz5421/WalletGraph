services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: walletgraph
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: walletgraph
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - walletgraph_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletgraph"]
      interval: 5s
      retries: 10
volumes:
  walletgraph_data:
